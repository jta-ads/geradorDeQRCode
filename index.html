<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR CODE</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/scripts.js" defer></script>
</head>
<body>
    <main>
        <h1> Gerador de QR Code</h1>
        <p>Insira uma URL ou texto, para criar um QR Code</p>
        <form id="form-gerator">
            <div id="texto">
                <input type="text" id="url" name="url" placeholder="Digite a URL ou Texto"> 
            </div>
            <div id="btn">
                <input type="submit" value="Gerar QR CODE">
            </div>
        </form>
        <div id="qr-code">
            <img src="" alt="qr-code">
        </div>
    </main>
</body>
</html>
